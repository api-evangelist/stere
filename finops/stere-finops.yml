meters:
- name: policies_issued
  description: Policies rated/quoted/bound/issued through the Stere Underwriting or Unified API; the plausible basis for volume-based contract terms, not publicly confirmed.
  unit: policies
  aggregation: count
  dimensions:
  - account
  - product
- name: premium_financed
  description: Premium volume financed through the Stere Pay Later BNPL gateway.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - partner
principles:
- name: Visibility
  description: Track policies issued and premium volume financed per product/partner, since these are the plausible drivers of Stere's negotiated contract pricing (not publicly confirmed).
- name: Allocation
  description: Map Stere usage (Underwriting API, Distribution, Claims, Pay Later) to the insurer, MGA, or partner line of business it serves.
- name: Optimization
  description: Consolidate distribution connections through the Unified API rather than integrating each carrier separately; scope Claims automation once assessment/resolution features exit development.
- name: Accountability
  description: Assign contract ownership to the product/underwriting team; review renewal terms and Pay Later financing economics against actual volume.
