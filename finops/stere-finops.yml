description: >-
  FinOps view of Stere spend. Stere is bought as a negotiated enterprise
  engagement, not metered through a public usage-based API billing surface.
  No per-call, per-quote, or per-policy price is published for the Underwriting
  API, Unified API, Distribution layer, Claims, or Pay Later gateway. The only
  disclosed economic signal is that Stere Pay Later introduces buy-now-pay-later
  financing economics on top of premium collection, which itself is negotiated
  per partner.
notes: >-
  No public per-unit rates exist to reconcile. This file reflects only the
  qualitative, contact-sales billing model described on stere.io; verify actual
  contract economics directly with Stere.
