actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and no public REST API reference
    exists either. No AsyncAPI document was created because there is no
    confirmed transport of any kind to model. All four API entries in
    apis.yml are marked endpointsModeled: true and sourced from Stere's own
    product marketing pages rather than a published API reference.
